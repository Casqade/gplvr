; Copy next to gplc67.exe alongside gplvr.exe and gplvr.dll, then launch gplvr.exe.

[loader]
; What gplvr.exe starts and injects. Paths are relative to gplvr.exe.
exe = gplc67.exe
dll = gplvr.dll

[gplvr]

; -- the mod ---------------------------------------------------------------------

; Present in a headset. Launches gplvr-xr.exe, hands it the back buffer through a shared
; D3D11 texture, and lets it own the OpenXR session. Off by default: it starts a second
; process and brings the runtime up, which is a lot to do to someone who only wanted the
; flat stereo mod. Any failure leaves the game running exactly as it would without it.
vr = 1

; Render each eye into one half of the back buffer. Required for vr. '1' toggles it in
; game.
;
; VR ONLY, like everything built to develop or measure the headset path: stereoKey,
; nullDraw and nullDrawKey, dumpEyesKey, shimMeasure, profilePolys, profileStages. With
; vr = 0 gplvr switches them all off and the game runs as vanilla in a borderless window --
; the window, the letterbox and widescreen fixes, front-end scaling, roglv2's glFinish drop
; and swap interval, and mouselook.
stereo = 1

; The mirror pass. 0 = off in both eyes, 1 = left eye only, 2 = both.
; The mirror is mono whatever this says -- it has its own view record and is rendered
; once -- so 1 pays for it once and looks the same as 2.
stereoMirror = 1

; Toggle stereo at runtime. 49 = '1'; 0 disables. The number row rather than a function
; key: pribluda and the in-game cameras have F1-F12 between them.
stereoKey = 49

; -- head and seat ---------------------------------------------------------------

; Take the current head pose as the seat. 51 = '3'. Not optional comfort: OpenXR's LOCAL
; space has its origin on the FLOOR, so without a recentre the view sits a standing
; height above the driver.
vrRecentreKey = 51

; HORIZON LOCK, 0.0 to 1.0 -- how much of the car's pitch is taken out of the view.
;
;   0.0  the view pitches with the car, which is what a driver's head actually does and
;        the physically correct answer
;   1.0  the view stays level with the world horizon while the car pitches under it
;   between -- blended, which is what most people who want this actually want
;
; The setting iRacing, ACC and AMS2 all ship, exposed as a percentage for the same
; reason: enough to take the edge off kerbs and braking, not so much that the car slides
; around underneath you.
;
; It blends the car's ROLL and its PITCH, roll first. Roll is the half that matters: you
; can counteract a pitched camera by tilting your own head, and nobody can counteract
; roll -- which is why Meta's VR guidance is blunt about never rotating the camera in
; roll, and why every sim horizon lock aims at banking, kerbs and body lean before it
; worries about braking dive.
;
; The pitch it removes is the CAR'S ATTITUDE over terrain, measured at -5 to +3 degrees
; and drifting continuously through zero. GPL's cockpit FRAMING -- the thing that used to
; aim the view at the wheel -- was the principal point, and that is corrected
; unconditionally at bind time. Different quantities; do not confuse the two.
vrHorizonLock = 0.0

; GPL world units per metre. Multiplies the eye separation and the head translation
; together, which is what "world scale" means in VR. Above 1.0 the world looks smaller.
; 1.0 asserts that one GPL unit is one metre, which is what the measurement says.
vrWorldScale = 1.0

; -- mouse look ------------------------------------------------------------------

; Drive the camera with the mouse, and stop head tracking driving it.
;
; Read through Raw Input, so the cursor is never touched and the game's own mouse
; handling is unaffected -- the same relationship GetAsyncKeyState has with keys.
;
; Works with vr = 0 as well, where it is simply free-look on a flat monitor. Intended to
; grow into a bindable axis so gamepad users can map it as a free-look input.
vrMouseLook = 0

; Degrees of view per raw mouse count. Device counts, not pixels, so Windows pointer
; speed and acceleration are not in the way and a sweep is repeatable between runs.
vrMouseLookSensitivity = 0.08

; Mouse forward looks up by default, as a head does. 1 inverts it.
vrMouseLookInvertPitch = 0

; Toggle mouse look in game. 54 = '6', 0 disables the toggle.
vrMouseLookKey = 54

; -- rendering -------------------------------------------------------------------

; Extra whole-scene renders per game frame, 0 to 3.
;
; The 36 Hz is the sim TASK RATE, not a rendering limit: sceneRender costs about a
; millisecond an eye out of an 11 ms budget at 90 Hz, and the game thread spends the rest
; of each tick idle. Rendering the scene again from a fresh head pose gives a real
; head-tracked frame rather than a reprojected one -- the world still animates at 36 Hz,
; but head motion, which is what causes discomfort, gets smooth.
;
; 1 gives 72 Hz of head tracking, 2 gives 108. Each waits for the presenter to publish a
; new pose rather than slicing the tick, and none will start a render that cannot finish
; before the game's next frame. Expected to become the default once the frame-rate work
; lands; until then it spends idle time a slower machine may want back.
vrExtraRenders = 2

; How much of the eye a MENU covers, 0.05 to 1.0. Menus are flat 2D images with no world
; render behind them, so at 1.0 they fill the whole 104-degree view a few centimetres
; from your face. The layer sits at infinity either way -- angular size is the only
; "distance" a projection layer has.
vrMenuScale = 0.5

; Brightness curve of the image in the headset: the eyes, the menus and the HUD panel. 1.0
; shows GPL's colours exactly as your monitor does. Above 1.0 lifts the mid-tones and the
; shadows while black stays black and white stays white -- GPL's art was made for CRTs and
; can look dark on a headset. 0.5 to 3.0; try 1.2 to 1.4. The flat window is not affected.
vrGamma = 1.0

; DEBUG. 1 submits the game's eye images with the head pose of the display they are shown
; on, instead of the pose they were rendered from. The world then loses the runtime's
; rotational correction and swims on fast turns; the point is to see whether the HUD
; panel's judder goes with it. vrDebugSubmitCurrentPoseKey toggles it in the headset,
; Insert (45) by default; 0 disables the key.
vrDebugSubmitCurrentPose = 0
vrDebugSubmitCurrentPoseKey = 45

; How far in front of you GPL's own in-race HUD sits, in metres. 0 puts it at infinity.
;
; The HUD -- the lap times, the flag state, the marshal column -- is about twenty
; drawDebugText calls that GPL makes ONCE, into the whole side-by-side buffer. Left-anchored
; items therefore land in the left eye only and right-anchored ones in the right eye only:
; not a HUD at the wrong depth, but half a HUD in each eye. gplvr re-issues every one of
; those calls against each eye's own surface, with the anchor remapped to the eye's width.
;
; Drawing the same thing at the same place in both eyes puts it at infinity, and for a
; block of 8-pixel text that is the uncomfortable case -- your eyes are converged on a
; cockpit a metre away and have to diverge to infinity to fuse it. A few pixels of
; convergent disparity pulls it to a dash distance. 2.0 is a good starting point; the
; conversion uses the runtime's own eye separation, so it is right for your IPD rather than
; for an assumed 63 mm.
vrHudDepth = 2.0

; Where PRIBLUDA's overlay -- lap times, the boards, tyres, dash, its fps counter -- hangs in
; the headset:
;   0  not at all
;   1  a panel that follows your head
;   2  a panel fixed to the seat: still while you look around, so you read it by looking at
;      it, in the sharp middle of the lens. It appears after the first recentre.
; The panel is an OpenXR quad layer the runtime draws itself on every display frame and
; samples once, straight to the display, so it holds still and stays sharp however GPL's own
; frames are paced. Its layout is gplvr_pribluda.ini, next to the game.
vrHudLayer = 2

; Where the panel hangs, one set for each mode, so Home can switch between two placements
; that each suit their mode. Ahead, Down and Right place the panel's centre in metres
; (negative Right is left); Width is its width in metres, and its height follows your
; monitor's shape. It turns to face you from there. Nothing hides it -- it is drawn over the
; game -- so hang it about as far away as the dash rather than behind the steering wheel.
;
; HEAD (vrHudLayer = 1): measured from your eyes and moving with them, so the panel stays at
; the same spot in the lens wherever you look. You cannot look AT it, only toward it, so keep
; it small and near the middle: the lens blurs and bends text a long way off-centre. At 0.70
; ahead, Down 0.10 puts the centre 8 degrees low, and a 0.45 width spans +-18 degrees.
vrHudHeadAhead = 0.70
vrHudHeadDown = 0.10
vrHudHeadRight = 0.0
vrHudHeadWidth = 0.45
;
; SEAT (vrHudLayer = 2): measured from your head at the last recentre, and fixed in the car.
; You turn your eyes or head to read it, so it can be bigger and lower, like a dash.
vrHudSeatAhead = 0.70
vrHudSeatDown = 0.25
vrHudSeatRight = 0.0
vrHudSeatWidth = 0.60

; Text size on the panel, RELATIVE to pribluda's own: 1.0 keeps the share of the panel the
; text has of your monitor. Raise it if it is too small at this size and distance.
vrHudTextScale = 1.0

; How dark the boxes behind pribluda's text are on the panel: 0 invisible, 1 solid black.
; pribluda's own boxes darken what is behind them to 70%, which is 0.30. Raise it if the
; text is hard to read against a dark background. The dash's boxes are solid either way.
vrHudBackdropOpacity = 0.30

; Switch the panel between following your head (vrHudLayer = 1) and fixed to the seat (2)
; while you drive. 36 = Home; 0 disables. With the panel off (vrHudLayer = 0) it turns it
; on, following your head. Switching to the seat before any recentre takes your head pose at
; that moment as the seat.
vrHudLayerKey = 36

; HUD TWEAK MODE -- place pribluda's elements on the panel from the headset. 35 = End; 0
; disables. In a race, with the panel showing, press it and the selected element gets an
; outline that cycles red, green, yellow:
;   arrows          move it; hold to keep moving
;   Page Up / Down  select another, in the order times, player board, leader board, track
;                   position board, tyres, tyre patch, fps, dash. Elements hidden (show = 0
;                   or pribluda's hotkeys) or without a position in gplvr_pribluda.ini are
;                   skipped. The dash moves as its box.
;   End again       leave, and write the positions to gplvr_pribluda.ini
; Home still switches head and seat while it is on, so one element can be checked both ways.
; While it is on the arrows and Page Up/Down do not reach the game. Leaving the race leaves
; the mode and saves as well.
vrHudTweakKey = 35

; How fast the arrows move an element, in fractions of the panel per second: 0.10 crosses
; the whole panel in ten seconds. Tap for small steps.
vrHudTweakSpeed = 0.10

; Which eye GPL's OWN in-race text goes into: 0 both, 1 the left only, 2 the right only.
;
; Both only works if the two copies fuse, and that depends on vrHudDepth placing them near
; the distance your eyes are already converged at. One eye has nothing to fuse and cannot
; get it wrong -- it overlays like a monocle. Switches the vrHudDepth disparity off, since a
; single copy has none. Pribluda's overlay is on the panel instead; see vrHudLayer.
vrHudEye = 0

; Move each eye to where it will be when its frame actually reaches the display.
;
; GPL renders on its own sim tick rather than on the headset's, so a frame is shown one or
; two display periods after the one its head pose was predicted for, and which of the two
; changes from frame to frame. The runtime corrects the ROTATION of a late frame but not
; its position, so close things -- the car itself -- step instead of gliding when you move
; your head sideways. With this on, the headset presenter publishes how the head is moving
; and when frames are displayed, and the eyes are moved forward by the displays in between.
; The log reports how many frames landed one, two or more periods on. 0 turns it off to
; compare.
vrPredictPosition = 1

; Multiply the runtime's RECOMMENDED per-eye render size.
;
; 1.0 keeps the recommendation -- around 3172x3172 for a Pico 4. Below 1.0 trades
; resolution the source does not have for encode time and link bandwidth it does: GPL
; hands us a 1280x1440 half, so at 1.0 we are already upscaling six times into pixels
; that carry no extra detail.
;
; There is no ceiling of 1.0. The runtime reports its recommended size and its MAXIMUM
; side by side -- 3172 against 8192 here -- and the presenter clamps to that maximum,
; which is the only figure that is a real limit. Ask for more and it says so in
; gplvr-xr.log and uses the maximum.
vrRenderScale = 1.0

; Render the whole frame off-screen, at the size vrRenderScale asks for, instead of into
; the game window.
;
; This is what makes vrRenderScale mean anything above 1.0. With it off the eyes are the
; two halves of the rasterizer's back buffer, so their size is a Windows display mode --
; 1280x1440 each at 2560x1440 -- and every pixel above that is invented by the
; presenter's upscale. With it on the game rasterizes at the headset's own resolution,
; the depth buffer goes from 16-bit to 24-bit, and the flat window becomes a scaled
; monitor of the result. The window itself keeps whatever resolution you configured.
;
; Start vrRenderScale LOW with this on, and work up. At 1.0 a Pico 4 asks for 3172x3172
; an eye, which is a 20-megapixel frame for a 1998 engine that does its own transform and
; clipping on the CPU. 0.4 is roughly the resolution GPL renders today; 0.6 is already a
; real improvement. Whether the ceiling is the GPU or the sim's own 36 Hz tick is worth
; finding out from gplvr.log rather than guessing -- the per-eye sceneRender cost is
; reported there once a second.
;
; The menus are left alone. GPL runs its front end in a 640x480 mode, its art and layout
; are in surface pixels at that size, and enlarging the surface underneath would leave
; the whole front end in the corner of a much larger buffer. The log says when it
; suspends and when it resumes.
;
; New, and off by default until it has been looked at. What to check in the first
; session: the in-race HUD, which is laid out in surface pixels like the menu is but is
; not covered by the 640x480 rule.
vrOffscreen = 0

; What the flat window shows while VR is on: 0 both eyes, 1 the left eye, 2 the right.
; Aspect-fitted, never stretched. Only does anything with vrOffscreen on -- without an
; off-screen frame the window IS the render and there is nothing to choose.
vrMonitorEye = 0

; -- the mouse pointer -----------------------------------------------------------

; Draw the mouse pointer into the VR image.
;
;   0  off
;   1  draw it while Windows says the pointer is showing
;   2  draw it always, whatever Windows says
;
; Windows composites the pointer onto the DESKTOP, never into the game's back buffer, so
; the picture that reaches the headset has no cursor in it and GPL's front end is
; unusable: the menus answer a pointer nobody can see.
;
; 1 follows the game's own ShowCursor, so nothing is painted over the driving view. Use 2
; if the menus are still cursorless with 1 -- it has NOT been confirmed that GPL leaves
; the pointer flagged as showing while its menus are up, and gplvr.log says which case
; you are in ("Windows reports the pointer HIDDEN" is the line to look for).
;
; It goes into whatever surface the frame was rendered into, so it covers the 640x480
; menus -- where off-screen rendering is suspended and the game draws into its own back
; buffer -- as well as the off-screen world frame, where one is drawn in each eye. The
; log carries the pointer's screen, client and surface coordinates and the framebuffer it
; went into, which is what to read first if it lands somewhere other than where the
; pointer really is.
;
; What gets drawn is the cursor Windows is actually showing -- your own arrow, your size,
; your theme -- and it follows the shape as it changes. A cursor whose pixels cannot be
; read draws nothing and says which step refused; there is no stand-in shape.
vrCursor = 1

; -- window and display ----------------------------------------------------------

; Break the frame budget into its parts, once a second, on a line of its own:
;
;   frame 8.05 ms (worst 12.1) = scene 3.68 + present 0.41 + gplvr 0.12 + other 3.84
;
; scene is the engine's world render (both passes, the mirror included); present is the
; engine's own SwapBuffers; gplvr is our work in the present hook; other is the remainder
; -- GPL's per-frame work outside the world pass, which is where the unexplained four to
; six milliseconds live. `other` is a subtraction, not a measurement, so it also absorbs
; scheduler idle: a big `other` on a quiet menu means nothing, a big one that GROWS with
; the number of cars on screen means everything.
; Rasterizer shim, stage 1: measure whether there is anything worth batching.
;
; roglv2's submission costs about 5 ms of an 8.8 ms frame -- 630 ns for each of 8,600
; polygons -- because it issues one glDrawArrays per polygon. A shim that merged them into
; a few draws would remove most of that, but only if GPL submits polygons in long runs
; that share rasterizer state. If it changes texture every polygon or two, there is
; nothing to merge and the idea is dead.
;
; This changes NOTHING. It forwards polyDraw and the four state setters untouched and
; reports, once a second:
;
;   shim 1.2M polys/s in 40k runs/s, mean run 31.0, longest 412, 78% of polys in
;   runs >=16 | runs<=N [1:900 2:400 ... ] | ended by [tex 30000 dest 200 ...]
;
; The number that decides it is "% of polys in runs >=16". High means batching is worth
; building; low means stop. "ended by" says which setter is breaking the runs, because
; texture changes and destination changes would need different answers.
;
; Off by default: it takes over five of the game's rasterizer function-pointer globals.
shimMeasure = 0

profileFrame = 1

; Drain the GPU with a glFinish at the end of the scene, and time it.
;
; This is the measurement that says what `present` is made of, and present is currently
; the largest term in the frame -- 4.2 to 4.8 ms with the field in view, more than the
; scene render itself. Two things could produce that. Either roglv2 flushes its polygon
; batch inside screenDisplay, in which case present is CPU submission cost and a batching
; replacement would remove it; or the GPU is behind and SwapBuffers is where it catches
; up, in which case no renderer work helps and the answer is less geometry.
;
; Read it as: an expensive gpuWait with present collapsing means the GPU was the queue; a
; cheap gpuWait with present unchanged means roglv2 is doing the work on the CPU.
;
; It stalls the pipeline once a frame, so the frame rate under it is NOT comparable with
; the frame rate without it. Turn it on for one session, read the number, turn it off.
profileGpuWait = 0

; Count polygons handed to the rasterizer, and report a cost per polygon.
;
; Says whether the renderer submits too many primitives or spends too long on each --
; which is the difference between "cull harder" and "submit differently". It thunks one of
; the game's rasterizer globals, so it is off by default.
profilePolys = 0

; Open the two boxes profileFrame only weighs: what the geometry load actually is, and what
; `present` is made of.
;
; Adds two lines a second:
;
;   geom 8615 polys (raster 8615, dropped 0) | verts 27114 ref -> 9820 transformed
;        (2.76x reuse) | 1412 matrix pushes | clipVerts 0 | 2.00 renders/frame
;   present = draw 3.11 ms (8901 calls, 349 ns each) + finish 0.02 + swap 0.28
;
; The first comes from counters GPL keeps for its own debug overlay and runs whether or not
; anything reads them, so it costs six loads per render. "transformed" is the number of
; vertices that actually went through the transform, against the number of times a vertex
; was referenced -- the gap is the memoisation, and the ratio is how much the track's
; geometry shares vertices between polygons. "dropped" is polygons GPL emitted that the
; rasterizer refused.
;
; The second times three of roglv2's import slots. THE FINISH IS THE NUMBER TO READ: roglv2
; issues that glFinish itself once per present, so timing it perturbs nothing, and it says
; how far behind the GPU was at that instant. Near zero means the GPU is idle and every
; millisecond of `present` is CPU submission -- which is the case for merging draws. Large
; means the GPU is the bottleneck and no submission change will help.
;
; In stereo the geometry counters cover BOTH eyes, because both eyes are what the frame
; cost; "renders/frame" on the same line says how many were summed.
;
; It also adds a third line, which opens the LARGEST box of all -- `pre`, the span from the
; present returning to the next sceneRender, 3.4 to 4.7 ms of a 6.95 ms frame:
;
;   pre 4.56 = tail 0.09 + WAIT.tick 3.61 + WAIT.bg 0.12 + latch 0.31 + logic 0.22
;              + redraw 0.21 + eyes 0.00 (rest 0.00)
;              | 3.73 ms of it is IDLE (82%) -- headroom, not cost | 144 of 144 frames ordered
;
;   tail       the previous loop iteration after its present: post-frame callbacks, the
;              snapshot release, and servicing anything the simulation asked the foreground
;              to do
;   WAIT.tick  IDLE. GPL's foreground loop opens by polling getBGCount() with Sleep(1)
;              until the simulation advances. This is why the frame rate equals the task
;              rate exactly with vsync off, and it is why `pre` is large on a HEALTHY
;              frame. Time here is spare, not spent.
;   WAIT.bg    IDLE, and a completely different diagnosis: the foreground then spins on the
;              simulation thread's lock, also with Sleep(1). Time here means the SIM
;              overran its slot, and no rendering change touches it.
;   latch      the per-frame snapshot of simulation state, taken with the sim suspended
;   logic      the message pump, the controller poll, event dispatch, and the application
;              state's own per-frame update
;   redraw     the window's dirty-rect union, the widget walk, and the mirror's bitmap
;              instance and camera, up to the moment sceneRender is entered
;   eyes       in stereo, the eye renders before the last one -- `pre` is measured to the
;              LAST sceneRender entry, so this keeps the parts adding up honestly
;
; The spans TILE `pre` exactly as the four top spans tile the frame, so `rest` is clock
; error; if it is not near zero, stop reading the parts. "N of M frames ordered" is the
; guard: with vrExtraRenders > 0 an extra render runs AFTER the present, so the frame's
; first sceneRender falls outside its own loop iteration and the decomposition is not
; defined. It says so rather than printing numbers.
;
; The markers are five call sites in gplc67's frame loop, found from the exe's own exported
; bgIsRunning / fgDisableBG / getBGCount plus the rasterizer's screenDisplay global, with
; every step asserting how many hits it expects. Nothing is patched unless all of them
; agree. Each marker is one QueryPerformanceCounter -- five a frame, against the thousands
; of rdtsc pairs the present line above already costs.
profileStages = 0

; Drop every polygon at the rasterizer boundary. THE PICTURE GOES BLACK.
;
; What is left is the floor no renderer change can go below -- an upper bound on everything
; a shim, a draw-call merge or a GPU rasterizer could ever recover, measured rather than
; argued. If the frame is still expensive with nothing drawn, the cost is GPL's own
; traversal, transform and clip, and no rasterizer work will touch it.
;
; Cannot be combined with shimMeasure: both want the polyDraw global, and gplvr refuses
; rather than letting one silently win.
;
; This is the STARTING state. Leave it 0 and use nullDrawKey: the frame worth measuring is
; the worst one on the track, and you cannot drive to it blind.
nullDraw = 0

; The frame is always split into four spans that TILE it, and their means appear on the
; ordinary frame line:
;
;   frame 8.90 = pre 4.10 + scene 2.30 + post 0.90 + present 1.60 + gplvr 0.00 (rest 0.00)
;         | WORST 10.28 = pre 3.90 + scene 2.40 + post 2.20 + present 1.78
;
;   pre      the game's own frame loop -- the sim step, input, frame setup, and the wait
;            for the next tick
;   scene    the world, both passes, both eyes
;   post     the HUD and 2D overlays, which GPL draws after sceneRender returns
;   present  roglv2's flush and SwapBuffers
;
; This replaced `other`, which was a SUBTRACTION -- the largest term in the frame was the
; one nobody could account for, and both times it got guessed at, the guess was wrong.
; `rest` is the leftover and should stay near zero; if it does not, the spans have stopped
; tiling and none of the numbers should be trusted.
;
; The same line then breaks down the WORST frame of the window, because an average over 130
; healthy frames and one sick one describes neither, and `worst` used to be a bare number
; with nothing to explain it. There is no threshold and nothing to enable -- the worst frame
; is always the one worth looking at.

; Virtual-key code that toggles nullDraw while the game runs. 0 disables the key.
; Default 0x39 = '9'. Drive into the corner that hurts, tap it, read the frame line for a
; second or two of black, tap it again.
;
; The thunk is installed whenever this or nullDraw is set, and the key only flips a byte it
; tests -- the rasterizer global is never rewritten while the renderer is running.
nullDrawKey = 57

; Write each EYE's own rectangle to gplvr-eye0.tga and gplvr-eye1.tga next to the game, at
; the moment the frame is handed to the headset.
;
; NOT the combined side-by-side the monitor shows -- that picture has its own scaling and
; its own blit, and reading it has repeatedly led to the wrong conclusion about what the
; eyes actually received. These are the clipped halves, straight out of the framebuffer
; with glReadPixels, before the publish. If something is in the frame it is in these files;
; if it is not, it never reached the buffer and no amount of looking at the monitor will
; say so.
;
; 0 = off. 48 = the '0' key on the number row, alongside stereoKey's '1' -- pribluda and
; the in-game cameras have F1-F12 between them, which is why the number row is used for
; gplvr's own keys. One tap writes one pair; the files are overwritten each time.
dumpEyesKey = 48

; The OpenGL swap interval: 0 disables vsync, 1 enables it, -1 leaves the driver alone.
;
; This is not a preference so much as a missing call. GPL never sets the swap interval at
; all -- roglv2 resolves wglSwapIntervalEXT and then never calls it, and its [RasterV2]
; VSync key is read by nobody -- so the driver default of 1 has always applied, on every
; path, whatever core.ini says.
;
; What that costs on a high-refresh display is a cliff rather than a slope. At 144 Hz the
; frame budget is 6.944 ms, and a frame that overruns it by a microsecond waits out the
; entire next refresh: measured over one session, the frame period only ever took the
; values 6.94-7.05 ms or 13.85-14.08 ms, never anything between, so the rate stepped
; straight from 144 to 72. The pixel format roglv2 asks for is double-buffered and there
; is no way to ask it for a third buffer, so nothing absorbs the overrun.
;
; With 0, an overrunning frame is late instead of doubled. In a composited borderless
; window the compositor still presents on the refresh and frames are dropped; in
; exclusive fullscreen you get tearing instead. The log says what the driver actually
; did, which matters because vsync forced on in the control panel makes the call succeed
; and change nothing.
swapInterval = 0

; THE WINDOW, in pixels. 0 0 means EXACTLY the current mode of the monitor it is on, at
; that monitor's origin -- which is the normal setting and the fast one. Give both or
; neither; one alone is ignored, and anything larger than the monitor is clamped to it.
;
; gplvr always owns the window and the display mode: borderless, the desktop mode never
; changed, and the world mode the engine is told about is the window's own size -- so this
; file, not core.ini, decides what resolution GPL renders at. There is no setting for
; handing that back, because the game's own policy is to switch the desktop to 640x480 and
; back twice a race, which is one of the two things this mod exists to stop.
;
; A size SMALLER than the monitor is an ordinary composited window: no exact cover, so no
; flip path and a little more latency, the taskbar visible, and alt-tab trivial. Everything
; else follows the window -- the menu is fitted into it, the 3D view fills it, and
; widescreenFix measures whatever shape it ends up.
windowWidth = 0
windowHeight = 0

; Where that window sits, relative to the monitor. -1 centres it. Ignored when the size
; is 0 0, because an exact cover has one place to be.
windowX = -1
windowY = -1


; Keep drawing and presenting while another application has the foreground.
;
; GPL has two draw gates -- roglv2's and gplc67's gpl_isForeground -- and both are driven
; by WM_ACTIVATEAPP, which DirectInput's subclass swallows, so neither ever clears on its
; own. gplvr drives them by hand from a polled focus edge, and this says which way.
;
; 0 is the right default on a monitor: a backgrounded game rendering at 144 fps is heat
; and fan noise for pixels nobody is looking at. 1 keeps the picture live while you read
; something over the top of it.
;
; FORCED ON IN VR whatever this says -- clicking another window must not black out the
; headset. Alt-tab works either way: the desktop is handed back by a SetWindowPos on focus
; loss, which is independent of whether the game is still drawing.
;
; A single-player AUTOPAUSE would make the question go away entirely -- pause the sim on
; focus loss and there is nothing left to keep drawing. Not built yet.
renderWhenUnfocused = 0

; How the 640x480 front end is scaled up to the window.
;
;   0  whole-number scale, nearest-neighbour -- every source pixel becomes an exact NxN
;      block and the art keeps the shape it was drawn with. The border is wider, because
;      the smaller of the two integer factors wins: at 2560x1440 that is 3, so the menu
;      lands at 1920x1440 and the sides are black.
;   1  aspect-fit, nearest-neighbour -- as large as it goes, hard-edged, with uneven block
;      sizes because the scale is fractional
;   2  aspect-fit, linear -- as large as it goes, smooth
;
; The menu is ALWAYS scaled, and there is no setting for not scaling it. It cannot be laid
; out at any other size -- 85 fixed 640x480 images with absolute widget coordinates, and
; gpl_startupScreenInit_640x480 refuses to start on anything else -- so once the window
; stops being 640x480 the only question left is how. The pointer is mapped back through
; the inverse of the same fit, so where you click is where the menu thinks you clicked.
menuFilter = 2

; Show the game's own black bars above and below the driving view.
;
; They are a UI LAYOUT, not a clip: bar = 50 * height / 480, three panels, and the 3D view
; is one bitmapInstanceAlloc of the middle panel's rect. 0 -- the default -- widens that
; rect through a rasterizer global gplvr already owns, grows the middle panel to the whole
; mode and hides the two bar panels through the screen's own layout virtual. No exe patch:
; three writable vtable slots, each refusing to install unless it still holds its stock
; target.
;
; CONFLICTS WITH THE COMMUNITY No Letterbox EXE PATCHES. Use one or the other; this one is
; configurable and reversible, theirs is baked into the exe. The intended setup is a
; vanilla GEM+ exe with only the 144 FPS patch applied.
enableLetterbox = 0

; Correct the field of view for a window wider than 4:3.
;
; GPL fixes the HORIZONTAL angle and derives the vertical from the surface's shape, so a
; wider window shows LESS, not more: a 2560x1440 window keeps three quarters of the
; design vertical field with the bars in, 95% with them out, and a 21:9 keeps far less
; than either. 1 restores the 4:3 design view exactly -- the same picture, wider.
;
; Ignored in VR, where the runtime's per-eye field of view wins.
widescreenFix = 1

; Copy next to gplc67.exe alongside gplvr.exe and gplvr.dll, then launch gplvr.exe.

[loader]
; What gplvr.exe starts and injects. Paths are relative to gplvr.exe.
exe = gplc67.exe
dll = gplvr.dll

[gplvr]

; -- the mod ---------------------------------------------------------------------

; Present in a headset. Launches gplvr-xr.exe, hands it the back buffer through a shared
; D3D11 texture, and lets it own the OpenXR session. Off by default: it starts a second
; process and brings the runtime up, which is a lot to do to someone who only wanted the
; flat stereo mod. Any failure leaves the game running exactly as it would without it.
vr = 1

; Render each eye into one half of the back buffer. Required for vr; useful on its own
; for side-by-side on a flat screen. '1' toggles it in game.
stereo = 1

; The mirror pass. 0 = off in both eyes, 1 = left eye only, 2 = both.
; The mirror is mono whatever this says -- it has its own view record and is rendered
; once -- so 1 pays for it once and looks the same as 2.
stereoMirror = 1

; MIRROR AIM. The game puts the mirror eye at the car origin + 0.35 m forward, facing
; backwards with a 40-degree horizontal field of view, and hands all of it to the renderer
; in the same block we already hook -- so aiming it needs no patched exe and no edited car
; model. Degrees for the angles, metres for the offsets, all zero = stock.
;
;   vrMirrorYaw    turn the mirror left (-) or right (+)
;   vrMirrorPitch  tilt it down (-) or up (+)
;   vrMirrorBack   move the virtual mirror further behind the car; widens what it sees
;   vrMirrorUp     raise it
;   vrMirrorFov    REPLACES the 40-degree default. Wider shows more road but shrinks
;                  everything in it, exactly like a real convex mirror. 0 = leave alone.
vrMirrorYaw = 0.0
vrMirrorPitch = 0.0
vrMirrorBack = 0.0
vrMirrorUp = 0.0
vrMirrorFov = 0.0

; Toggle stereo at runtime. 49 = '1'; 0 disables. The number row rather than a function
; key: pribluda and the in-game cameras have F1-F12 between them.
stereoKey = 49

; -- head and seat ---------------------------------------------------------------

; Take the current head pose as the seat. 51 = '3'. Not optional comfort: OpenXR's LOCAL
; space has its origin on the FLOOR, so without a recentre the view sits a standing
; height above the driver.
vrRecentreKey = 51

; HORIZON LOCK, 0.0 to 1.0 -- how much of the car's pitch is taken out of the view.
;
;   0.0  the view pitches with the car, which is what a driver's head actually does and
;        the physically correct answer
;   1.0  the view stays level with the world horizon while the car pitches under it
;   between -- blended, which is what most people who want this actually want
;
; The setting iRacing, ACC and AMS2 all ship, exposed as a percentage for the same
; reason: enough to take the edge off kerbs and braking, not so much that the car slides
; around underneath you.
;
; It blends the car's ROLL and its PITCH, roll first. Roll is the half that matters: you
; can counteract a pitched camera by tilting your own head, and nobody can counteract
; roll -- which is why Meta's VR guidance is blunt about never rotating the camera in
; roll, and why every sim horizon lock aims at banking, kerbs and body lean before it
; worries about braking dive.
;
; The pitch it removes is the CAR'S ATTITUDE over terrain, measured at -5 to +3 degrees
; and drifting continuously through zero. GPL's cockpit FRAMING -- the thing that used to
; aim the view at the wheel -- was the principal point, and that is corrected
; unconditionally at bind time. Different quantities; do not confuse the two.
vrHorizonLock = 0.0

; GPL world units per metre. Multiplies the eye separation and the head translation
; together, which is what "world scale" means in VR. Above 1.0 the world looks smaller.
; 1.0 asserts that one GPL unit is one metre, which is what the measurement says.
vrWorldScale = 1.0

; -- mouse look ------------------------------------------------------------------

; Drive the camera with the mouse, and stop head tracking driving it.
;
; Read through Raw Input, so the cursor is never touched and the game's own mouse
; handling is unaffected -- the same relationship GetAsyncKeyState has with keys.
;
; Works with vr = 0 as well, where it is simply free-look on a flat monitor. Intended to
; grow into a bindable axis so gamepad users can map it as a free-look input.
vrMouseLook = 0

; Degrees of view per raw mouse count. Device counts, not pixels, so Windows pointer
; speed and acceleration are not in the way and a sweep is repeatable between runs.
vrMouseLookSensitivity = 0.08

; Mouse forward looks up by default, as a head does. 1 inverts it.
vrMouseLookInvertPitch = 0

; Toggle mouse look in game. 54 = '6', 0 disables the toggle.
vrMouseLookKey = 54

; -- rendering -------------------------------------------------------------------

; Extra whole-scene renders per game frame, 0 to 3.
;
; The 36 Hz is the sim TASK RATE, not a rendering limit: sceneRender costs about a
; millisecond an eye out of an 11 ms budget at 90 Hz, and the game thread spends the rest
; of each tick idle. Rendering the scene again from a fresh head pose gives a real
; head-tracked frame rather than a reprojected one -- the world still animates at 36 Hz,
; but head motion, which is what causes discomfort, gets smooth.
;
; 1 gives 72 Hz of head tracking, 2 gives 108. Each waits for the presenter to publish a
; new pose rather than slicing the tick, and none will start a render that cannot finish
; before the game's next frame. Expected to become the default once the frame-rate work
; lands; until then it spends idle time a slower machine may want back.
vrExtraRenders = 2

; How much of the eye a MENU covers, 0.05 to 1.0. Menus are flat 2D images with no world
; render behind them, so at 1.0 they fill the whole 104-degree view a few centimetres
; from your face. The layer sits at infinity either way -- angular size is the only
; "distance" a projection layer has.
vrMenuScale = 0.5

; Multiply the runtime's RECOMMENDED per-eye render size.
;
; 1.0 keeps the recommendation -- around 3172x3172 for a Pico 4. Below 1.0 trades
; resolution the source does not have for encode time and link bandwidth it does: GPL
; hands us a 1280x1440 half, so at 1.0 we are already upscaling six times into pixels
; that carry no extra detail.
;
; There is no ceiling of 1.0. The runtime reports its recommended size and its MAXIMUM
; side by side -- 3172 against 8192 here -- and the presenter clamps to that maximum,
; which is the only figure that is a real limit. Ask for more and it says so in
; gplvr-xr.log and uses the maximum.
vrRenderScale = 1.0

; Render the whole frame off-screen, at the size vrRenderScale asks for, instead of into
; the game window.
;
; This is what makes vrRenderScale mean anything above 1.0. With it off the eyes are the
; two halves of the rasterizer's back buffer, so their size is a Windows display mode --
; 1280x1440 each at 2560x1440 -- and every pixel above that is invented by the
; presenter's upscale. With it on the game rasterizes at the headset's own resolution,
; the depth buffer goes from 16-bit to 24-bit, and the flat window becomes a scaled
; monitor of the result. The window itself keeps whatever resolution you configured.
;
; Start vrRenderScale LOW with this on, and work up. At 1.0 a Pico 4 asks for 3172x3172
; an eye, which is a 20-megapixel frame for a 1998 engine that does its own transform and
; clipping on the CPU. 0.4 is roughly the resolution GPL renders today; 0.6 is already a
; real improvement. Whether the ceiling is the GPU or the sim's own 36 Hz tick is worth
; finding out from gplvr.log rather than guessing -- the per-eye sceneRender cost is
; reported there once a second.
;
; The menus are left alone. GPL runs its front end in a 640x480 mode, its art and layout
; are in surface pixels at that size, and enlarging the surface underneath would leave
; the whole front end in the corner of a much larger buffer. The log says when it
; suspends and when it resumes.
;
; New, and off by default until it has been looked at. What to check in the first
; session: the in-race HUD, which is laid out in surface pixels like the menu is but is
; not covered by the 640x480 rule.
vrOffscreen = 0

; What the flat window shows while VR is on: 0 both eyes, 1 the left eye, 2 the right.
; Aspect-fitted, never stretched. Only does anything with vrOffscreen on -- without an
; off-screen frame the window IS the render and there is nothing to choose.
vrMonitorEye = 0

; -- the mouse pointer -----------------------------------------------------------

; Draw the mouse pointer into the VR image.
;
;   0  off
;   1  draw it while Windows says the pointer is showing
;   2  draw it always, whatever Windows says
;
; Windows composites the pointer onto the DESKTOP, never into the game's back buffer, so
; the picture that reaches the headset has no cursor in it and GPL's front end is
; unusable: the menus answer a pointer nobody can see.
;
; 1 follows the game's own ShowCursor, so nothing is painted over the driving view. Use 2
; if the menus are still cursorless with 1 -- it has NOT been confirmed that GPL leaves
; the pointer flagged as showing while its menus are up, and gplvr.log says which case
; you are in ("Windows reports the pointer HIDDEN" is the line to look for).
;
; It goes into whatever surface the frame was rendered into, so it covers the 640x480
; menus -- where off-screen rendering is suspended and the game draws into its own back
; buffer -- as well as the off-screen world frame, where one is drawn in each eye. The
; log carries the pointer's screen, client and surface coordinates and the framebuffer it
; went into, which is what to read first if it lands somewhere other than where the
; pointer really is.
;
; What gets drawn is the cursor Windows is actually showing -- your own arrow, your size,
; your theme -- and it follows the shape as it changes. A cursor whose pixels cannot be
; read draws nothing and says which step refused; there is no stand-in shape.
vrCursor = 1

; -- window and display ----------------------------------------------------------

; Break the frame budget into its parts, once a second, on a line of its own:
;
;   frame 8.05 ms (worst 12.1) = scene 3.68 + present 0.41 + gplvr 0.12 + other 3.84
;
; scene is the engine's world render (both passes, the mirror included); present is the
; engine's own SwapBuffers; gplvr is our work in the present hook; other is the remainder
; -- GPL's per-frame work outside the world pass, which is where the unexplained four to
; six milliseconds live. `other` is a subtraction, not a measurement, so it also absorbs
; scheduler idle: a big `other` on a quiet menu means nothing, a big one that GROWS with
; the number of cars on screen means everything.
; Make GPL's vertical-axis billboards (trees, spectators) face the eye rather than the
; view plane.
;
; GPL builds those quads from the camera's FORWARD direction, so every billboard on
; screen shares one normal. At a monitor's 40-50 degree field that is within a few degrees
; of facing you and nobody notices. At 100+ degrees per eye it is not: a tree at the edge
; of vision is mis-yawed by up to ~50 degrees, so it foreshortens and turns its face away,
; and turning your head re-aims every billboard at once -- with the car, the tree and your
; body all stationary.
;
; This substitutes the horizontal direction from the sprite to the eye. Only the
; vertical-axis variant is touched; smoke and dust are rotationally symmetric puffs where
; screen-aligned is not wrong. Set to 0 to A/B against stock.
billboardFaceEye = 1

; Rasterizer shim, stage 1: measure whether there is anything worth batching.
;
; roglv2's submission costs about 5 ms of an 8.8 ms frame -- 630 ns for each of 8,600
; polygons -- because it issues one glDrawArrays per polygon. A shim that merged them into
; a few draws would remove most of that, but only if GPL submits polygons in long runs
; that share rasterizer state. If it changes texture every polygon or two, there is
; nothing to merge and the idea is dead.
;
; This changes NOTHING. It forwards polyDraw and the four state setters untouched and
; reports, once a second:
;
;   shim 1.2M polys/s in 40k runs/s, mean run 31.0, longest 412, 78% of polys in
;   runs >=16 | runs<=N [1:900 2:400 ... ] | ended by [tex 30000 dest 200 ...]
;
; The number that decides it is "% of polys in runs >=16". High means batching is worth
; building; low means stop. "ended by" says which setter is breaking the runs, because
; texture changes and destination changes would need different answers.
;
; Off by default: it takes over five of the game's rasterizer function-pointer globals.
shimMeasure = 0

profileFrame = 1

; Drain the GPU with a glFinish at the end of the scene, and time it.
;
; This is the measurement that says what `present` is made of, and present is currently
; the largest term in the frame -- 4.2 to 4.8 ms with the field in view, more than the
; scene render itself. Two things could produce that. Either roglv2 flushes its polygon
; batch inside screenDisplay, in which case present is CPU submission cost and a batching
; replacement would remove it; or the GPU is behind and SwapBuffers is where it catches
; up, in which case no renderer work helps and the answer is less geometry.
;
; Read it as: an expensive gpuWait with present collapsing means the GPU was the queue; a
; cheap gpuWait with present unchanged means roglv2 is doing the work on the CPU.
;
; It stalls the pipeline once a frame, so the frame rate under it is NOT comparable with
; the frame rate without it. Turn it on for one session, read the number, turn it off.
profileGpuWait = 0

; Count polygons handed to the rasterizer, and report a cost per polygon.
;
; Says whether the renderer submits too many primitives or spends too long on each --
; which is the difference between "cull harder" and "submit differently". It thunks one of
; the game's rasterizer globals, so it is off by default.
profilePolys = 0

; The OpenGL swap interval: 0 disables vsync, 1 enables it, -1 leaves the driver alone.
;
; This is not a preference so much as a missing call. GPL never sets the swap interval at
; all -- roglv2 resolves wglSwapIntervalEXT and then never calls it, and its [RasterV2]
; VSync key is read by nobody -- so the driver default of 1 has always applied, on every
; path, whatever core.ini says.
;
; What that costs on a high-refresh display is a cliff rather than a slope. At 144 Hz the
; frame budget is 6.944 ms, and a frame that overruns it by a microsecond waits out the
; entire next refresh: measured over one session, the frame period only ever took the
; values 6.94-7.05 ms or 13.85-14.08 ms, never anything between, so the rate stepped
; straight from 144 to 72. The pixel format roglv2 asks for is double-buffered and there
; is no way to ask it for a third buffer, so nothing absorbs the overrun.
;
; With 0, an overrunning frame is late instead of doubled. In a composited borderless
; window the compositor still presents on the refresh and frames are dropped; in
; exclusive fullscreen you get tearing instead. The log says what the driver actually
; did, which matters because vsync forced on in the control panel makes the call succeed
; and change nothing.
swapInterval = 0

; Swallow ChangeDisplaySettings[Ex] so the rasterizer stops switching the desktop between
; the menu mode and the sim mode.
blockDisplayChange = 1

; Swallow ClipCursor, which is what traps the pointer inside the render window.
blockClipCursor = 0

; Keep drawing and presenting while the game is NOT the foreground app.
;
; GPL has two independent draw gates, both driven by WM_ACTIVATEAPP: one in the rasterizer
; that skips ALL polygon and line drawing, and one in the game that skips the present. A
; backgrounded GPL therefore renders nothing and shows nothing -- correct for an exclusive
; fullscreen game in 1998, wrong for a borderless window, and wrong in VR, where clicking
; another window should not black out the headset.
;
; 1 chains a window proc ahead of both and swallows only the DEACTIVATION half of
; WM_ACTIVATEAPP, so the gates keep the value the last activation gave them. Activations
; still pass through untouched.
renderWhenUnfocused = 0

; Stop the rasterizer forcing its window above everything else.
allowWindowTopmost = 0

; Make the render window one pixel short of the desktop. On by default: a borderless
; window exactly covering the screen gets handed fullscreen exclusivity by Windows, after
; which nothing composites over it, alt-tab included.
shrinkWindowByOnePixel = 1

; This file belongs in the gplvr folder inside the Grand Prix Legends folder, beside gplvr.exe
; and gplvr.dll. Launch gplvr.exe. Every log and ini gplvr writes lands in that folder too.

[loader]
; What gplvr.exe starts and injects. Paths are relative to gplvr.exe.
; Target exe is looked first in current dir and then in its parent dir.
; This can be overridden with cmd argument: `gplvr.exe --exe gpl2020demo.exe`.
; Anything else on the command line is passed straight to the game.
exe = gplc67.exe
dll = gplvr.dll

[gplvr]

; -- the mod ---------------------------------------------------------------------

; Run in VR. Falls back to flat mode if the headset runtime fails; gplvr.log says why.
;   0  flat mode -- a borderless window, mouse look, no VR
;   1  VR mode
vr = 1

; Give each eye its own reflection, so the mirrors have depth. To switch the mirrors off
; use mirrorUpdateRate = 0 instead.
;   0  one shared reflection from the centre of your head -- half the cost
;   1  a correct reflection per eye -- twice the mirror work
perEyeMirror = 1

; Redraw the mirrors once every N frames, 1 to 16; 0 blacks them out. Raise it first if you
; are short of frame rate -- 3 or 4 still looks live and costs a fraction as much.
mirrorUpdateRate = 1

; WHERE THE MIRRORS POINT is set per car and per glass in gplvr_mirrors.ini, not here; tweak
; mode below writes it for you. <glass>Yaw turns that glass -- the view moves twice as far,
; and positive turns it toward the car's right -- <glass>Pitch tilts it, <glass>FovScale sets
; how much shows. The glasses are left, right and centre.

; MIRROR TWEAK MODE -- aim the mirrors from inside the headset. 77 = M, 0 disables it.
; Home picks what to aim: all glasses together, then each glass in turn. Left/Right turn,
; Up/Down tilt, Page Up/Down widen and narrow. Leaving the mode saves the result for the car
; you were driving.
vrMirrorTweakKey = 77

; How fast tweak mode moves the glasses while a key is held: degrees per second for turning
; and tilting, doublings per second for the width. Tap a key for a small step.
vrMirrorTweakAngleSpeed = 10.0
vrMirrorTweakFovSpeed = 0.5

; Toggle perEyeMirror while you drive, to compare the two back to back. 78 = N, 0 disables.
vrMirrorModeKey = 78

; -- head and seat ---------------------------------------------------------------

; Put the seat where your head is now. 51 = '3', 0 disables it. Needed once a session --
; until you press it you are looking down at the car from standing height.
vrRecentreKey = 51

; How much of the car's leaning and pitching is kept out of your view, 0.0 to 1.0. Takes the
; edge off kerbs; too much and the car slides around underneath you. Start low and raise it
; until kerbs stop bothering you.
;   0.0  the view rolls and pitches with the car
;   1.0  the view stays level with the world
vrHorizonLock = 0.0

; How big the world is, in GPL units per metre. Raise it to make the world look smaller,
; lower it to make it look larger. VR only.
vrWorldScale = 1.0

; Hear the race from your head instead of from the driver's eye. In the cockpit, turning your
; head moves the other cars between your ears, and your own engine with them. GPL only pans
; left and right, so nothing sounds behind or above you. TV cameras and replays sound as in GPL.
; 0 leaves GPL's sound alone. VR only.
vrHeadAudio = 1

; -- mouse look ------------------------------------------------------------------

; Look around with the mouse: free-look on a monitor, and in the headset it replaces head
; tracking, so you can put the view at the same angle twice and compare. Menus still work.
vrMouseLook = 0

; Degrees of view per unit of mouse movement. Windows pointer speed and acceleration do not
; affect it, so the same sweep of your hand always gives the same angle.
vrMouseLookSensitivity = 0.08

; Pushing the mouse forward looks up, as a head does. 1 inverts it.
vrMouseLookInvertPitch = 0

; Turn mouse look on and off while you play. 54 = the '6' key; 0 disables the toggle.
vrMouseLookKey = 54

; -- rendering -------------------------------------------------------------------

; HOW OFTEN THE GAME DRAWS A PICTURE. vsync follows this, so it is the only frame-rate
; setting there is. None of these change physics, AI or lap times; 1 and 2 add one physics
; step of latency (7 ms patched, 28 ms stock).
;   0  one picture per physics step (36/s stock, 144/s patched), vsync on
;   1  one picture per frame you are shown -- the headset's or the monitor's rate
;   2  as fast as the machine can draw, vsync off, for the freshest head position
frameRate = 1

; How much of your view the game's menus cover, 0.05 to 1.0. Raise it if the menu text is
; too small to read, lower it if the menus feel like they are in your face.
vrMenuScale = 0.5

; Brightness of the headset picture, 0.5 to 3.0. 1.0 is GPL's own colours; above that lifts
; mid-tones and shadows without washing out black or white. Try 1.2 to 1.4.
vrGamma = 1.0

; How far in front of you GPL's own in-race text sits, in metres. 0 puts it at infinity,
; which tires your eyes within a lap or two; dash distance is comfortable, 2.0 a good start.
vrHudDepth = 2.0

; How far in from the edges of your view GPL's own 2D is pulled, 0.1 to 1.0. GPL lays its
; screens out for a 4:3 monitor, where a corner is a glance away; in a headset the corners are
; somewhere you cannot comfortably look.
;   1.0  GPL's own layout, every position exactly where GPL put it
;   0.6  a corner item ends up 20% in from the edge
; Below 1.0 this moves things closer together without making them smaller, so anything drawn
; as a tight row -- the replay controls are ten buttons at a 37-pixel spacing -- will start to
; overlap. Leave it at 1.0 unless the in-race text is too far out to read.
vrHudInset = 1.0

; Who draws GPL's own text in the headset -- the pause prompt, "press F1 for help", "car must
; be stopped" and "press enter to return to pit".
; GPL's own fps counter and its lap-times block are NOT among them and no setting here reaches
; them: GPL draws those onto the window's back buffer, which the headset is never shown, so what
; you see in the monitor's bottom-right corner has no copy in the headset to make bigger.
;   0  GPL does, where GPL puts it. That is the corners of a 2560x1440 monitor layout, which in
;      a headset is over your shoulder, and it sits at infinity however vrHudDepth is set.
;      Nothing can move it there: the surface GPL names decides where IN a picture a letter
;      goes, not which picture it goes into, so asking for it somewhere else loses it entirely.
;   1  gplvr does. It takes each letter out of GPL's own font and draws it again as a small
;      picture of its own, once per eye, which is what lets the two settings below work. The
;      letters are GPL's, pixel for pixel; only where they are and how big they are changes.
; vrHudInset above belongs to the other route and does nothing in a headset. This is the one
; that reaches GPL's text. Flat mode is unaffected either way -- there gplvr already draws this
; text because it is far faster, and always exactly where GPL asked for it.
vrGplText = 0

; How much bigger GPL's text is drawn, 1 to 4. Needs vrGplText = 1.
; Whole numbers only, and that is the font's doing: GPL's letters are tiny bitmaps, so 2 makes
; each dot a 2x2 block and stays sharp, while 1.5 would have to drop and double rows along a
; line and would come out ragged. 2 is a good start on a 2560-wide layout.
vrGplTextScale = 1

; How far in from the edges of your view GPL's text is pulled, 0.1 to 1.0. Needs vrGplText = 1.
; It is how much of GPL's own distance from the middle of its layout is kept, measured in GPL's
; own pixels and laid off from the middle of your eye.
;   1.0  the distance GPL authored. Already about 10% in from the edge rather than at it,
;        because your eye covers more than the monitor layout the text was laid out for
;   0.4  a corner line ends up most of the way in, which is inside the area you can read
;        without moving your head
;   0.1  everything gathered near the middle
; Unlike vrHudInset this moves a LINE and not the letters in it, so the spacing inside "press
; pause to resume" stays GPL's however far in the line is pulled. Pulling lines in brings them
; closer together while vrGplTextScale makes them taller, so a line that would land on the one
; above it is moved down until it clears; GPL's top-to-bottom order is kept. Turn it down
; together with vrGplTextScale: if a scaled line will not fit inside one eye it is dropped
; rather than spilling into the other, and gplvr.log counts that, and the lines moved down, on
; its `fast text: placement` line.
; In a replay GPL's controls and the text on them are not placed by this: they go on a panel of
; their own below your view, which the controller points at.
vrGplTextInset = 1.0

; Where pribluda's overlay -- lap times, boards, tyres, dash -- hangs in the headset. What
; it shows comes from gplvr_pribluda.ini; the tweak mode below arranges it for you.
;   0  on the monitor only
;   1  on a panel that follows your head, always in the same place in your view
;   2  on a panel fixed to the car -- appears once you have pressed vrRecentreKey
vrHudLayer = 2

; Where the panel hangs, one set of numbers per mode. Ahead/Down/Right are its centre in
; metres (negative Right is left), Width is its width; it always turns to face you and
; nothing hides it, so hang it about dash distance away.
;
; HEAD (vrHudLayer = 1) moves with your eyes, so keep it small and near the middle --
; lenses blur text far off-centre.
vrHudHeadAhead = 0.70
vrHudHeadDown = 0.10
vrHudHeadRight = 0.0
vrHudHeadWidth = 0.45
;
; SEAT (vrHudLayer = 2) stays put in the car, so it can sit lower and bigger, like a dash.
vrHudSeatAhead = 0.70
vrHudSeatDown = 0.25
vrHudSeatRight = 0.0
vrHudSeatWidth = 0.60

; There is no separate text size: a wider panel makes everything on it bigger together.

; How dark the boxes behind pribluda's text are: 0 invisible, 1 solid black. Raise it if the
; text is hard to read against a bright sky or a pale track.
vrHudBackdropOpacity = 0.30

; Move the panel between following your head and fixed to the car while you drive. 36 =
; Home, 0 disables it. With the panel off it turns it on, following your head.
vrHudLayerKey = 36

; HUD TWEAK MODE -- arrange pribluda's readouts on the panel from inside the headset. 35 =
; End, 0 disables it. The selected readout gets a flashing outline: arrows move it, Page
; Up/Down pick another, End again leaves and saves.
vrHudTweakKey = 35

; How fast the arrows move a readout, in fractions of the panel per second: 0.10 crosses
; the whole panel in ten seconds. Tap a key for a small step.
vrHudTweakSpeed = 0.10

; Redraw pribluda's panel once every N frames, 1 to 8. Its numbers change a few times a
; second anyway, so 2 halves the cost and loses nothing. vrHudLayer = 0 switches it off.
pribludaUpdateRate = 2

; EXPERIMENTAL AND UNFINISHED. Leave at 0 unless you are testing it -- nothing here is
; faster yet.
;   0  off
;   1  run the new path alongside the old one; gplvr.log reports whether the two agree
;   2  draw the cars from the new path
simRing = 0

; Multiply the per-eye resolution your headset asks for; 1.0 is the runtime's own
; recommendation, about 3172x3172 on a Pico 4. Start low and work up -- 0.4 is roughly GPL's
; original render size, 0.6 already a real improvement. Menus are unaffected.
vrRenderScale = 1.0

; What the monitor window shows while you are in the headset, fitted without stretching. Also
; "Monitor view" in the VR menu, which changes it as you move it.
;   0  off -- the window is black, and the copy into it is saved
;   1  both eyes
;   2  the left eye
;   3  the right eye
vrMonitorEye = 1

; Wait for the graphics card to finish each frame before handing it to the headset. 0 skips
; the wait and saves about half a millisecond; put it back to 1 if frames tear or flicker.
vrTransferFinish = 1

; Draw straight into the texture the headset reads instead of copying it across. The copy
; costs 1 to 2 ms of an 11 ms frame, so 1 is free frame rate if it works. Watch the first
; run for swapped red/blue or flickering; gplvr.log says whether it took.
vrDirectToShared = 0

; -- GPL's "no signal" static ----------------------------------------------------

; GPL fills the screen with TV static for a frame or a few whenever it has no camera view ready:
; switching cars or views, a replay cut. In the headset that static would arrive as two
; different noise images, one per eye.
;   0  show it as GPL draws it
;   1  in a race, keep showing the last picture through the moment; in replays, or if it
;      lasts more than a quarter of a second, fill both eyes with the static
vrNoSignal = 1

; -- profiling -------------------------------------------------------------------

; THE PROFILING OPTIONS BELOW ARE FOR CHASING A PERFORMANCE PROBLEM, not for playing. They
; write to gplvr.log once a second and change nothing you see; several cost frame rate.

; Report the frame rate and where a frame's time went, once a second. Cheap, and on by
; default: it is the line to look at first, and the one to quote if you report a problem.
profileFrame = 1

; Also measure how long the graphics card takes, to tell a GPU problem from a CPU one. The
; measurement makes the game wait, which costs frame rate, so turn it back off afterwards.
profileGpuWait = 0

; Also count the polygons drawn and report a cost per polygon, to tell "too much geometry"
; apart from "each polygon is too expensive". Off by default since it adds overhead of its
; own.
profilePolys = 0

; THE FULL BREAKDOWN, headset only: where every millisecond went, waiting counted apart from
; working, with the worst frame of each second. Turn it on when the frame rate is wrong and
; you do not know why. The biggest figure is usually spare time, not cost.
profileStages = 0

; The work-against-waiting split on its own: cheap, and works on a flat monitor too. The
; first thing worth knowing about a frame rate that will not go up.
profileWorkWait = 0

; How long a single draw call has to take, in microseconds, before it counts as waiting for
; the graphics driver rather than as work. 0 counts every draw as work. Only worth moving
; if the work/wait split above looks implausible for your machine.
profileStallUs = 50

; The headset rate the headroom line compares your frame against. 90 gives an 11.11 ms
; frame budget; set it to whatever your headset actually runs at.
profileTargetHz = 90

; Save what each eye received to gplvr-eye0.tga and gplvr-eye1.tga. 48 = '0', 0 disables it.
; Attach these rather than a monitor screenshot when reporting something you saw in VR.
dumpEyesKey = 48

; TOGGLE frameRate BETWEEN 0 AND THE VALUE BELOW, LIVE. 55 = '7', 0 disables it. 0 is vanilla
; pacing with no blend and no extra frames, so this is the A/B for anything that might be the
; blend's: look at the artifact, press it, look again. Nothing is reinstalled either way.
frameRateKey = 55

; DRAW THE EXTRA (INTERPOLATED) RENDERS BETWEEN SIM TICKS. 1 as always, 0 to stop them.
; This is the one test frameRate = 0 cannot do. frameRate = 0 turns off blending AND these
; together, so "the artifact went away" tells you nothing about which of the two it was. Leave
; frameRate where it is and set this to 0: blending still happens, the extra renders do not.
;   artifact still there -> it is in the blended values
;   artifact gone        -> it is in what an extra render fails to redraw. One re-enters the
;                           scene render alone and paints the world over a frame that already
;                           had its 2D in it, and only the HUD, the pointer and the VR ray are
;                           put back afterwards -- so a background pass or a per-frame bar is
;                           simply missing for that frame.
; gplvr.log says SUPPRESSED on purpose on its `extra:` line, so a log can never be mistaken for
; one where the renders just never found room.
vrExtraRenders = 1


; VSYNC, an override -- you should not normally need it, and it is refused in VR. With only
; two buffers, vsync on is a cliff: missing the frame budget by a microsecond costs a whole
; refresh, measured as 144 fps dropping straight to 72. Driver triple buffering smooths it.
;  -1  let frameRate decide
;   0  force vsync off
;   1  force vsync on, one frame per refresh
; 2-4  force vsync on, one frame per that many refreshes
swapInterval = -1

; -- window and display ----------------------------------------------------------

; THE GAME WINDOW, in pixels. 0 0 fills the monitor at its current resolution, which is the
; fastest; give both numbers or neither, and anything bigger than the monitor is shrunk to
; fit. A smaller window is an ordinary desktop window, so you keep the taskbar.
windowWidth = 0
windowHeight = 0

; Where that window sits on the monitor. -1 centres it. Ignored at 0 0, where the window
; covers the monitor and has only one place to be.
windowX = -1
windowY = -1


; Keep drawing while another program has the focus. Always on in VR, whatever this says. The
; race does not pause either way, so this is not a way to step away from the car.
renderWhenUnfocused = 0

; HOW THE MENUS ARE ENLARGED. GPL drew its front end at 640x480, so it is always scaled up
; to fit your window; clicks land where the menu expects either way.
;   0  whole-number scale, hard edges -- exact square blocks, widest border
;   1  as large as it will go, hard edges -- sharp, but uneven letter strokes
;   2  as large as it will go, smoothed
;
; 0 and 1 look identical whenever the fit is a whole number. In a headset prefer 2 -- uneven
; blocks shimmer as your head moves. Not in the VR menu.
menuFilter = 2

; Show the game's own black bars above and below the driving view; 0 gives the picture the
; whole window. Do not combine this with a "No Letterbox" exe patch -- pick one or other.
enableLetterbox = 0

; Quit straight out instead of watching the credits roll. Applies in VR and on the monitor.
; 0 leaves GPL's own behaviour alone.
skipCredits = 1

; Turn on GPL's mirror "driver arms" detail, which GPL has no setting for and leaves off. Off,
; a stock car's simplified steering wheel shows in the mirror as an opaque yellow square when
; the car is a few metres behind and RasterV2:MirrorSize in core.ini is 512. On, the mirror
; draws it textured, as the forward view does. Applies in VR and on the monitor.
mirrorDriverArms = 1

; Correct the field of view for a window wider than 4:3. Leave it on. A widescreen window
; shows less of the track vertically, not more. Ignored in VR.
widescreenFix = 1

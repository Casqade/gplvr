; gplvr_pribluda.ini -- Pribluda layout in VR.
;
; POSITIONS ARE FRACTIONS OF THE PANEL, 0 to 1. X runs left to right, Y top to bottom:
; 0,0 is the panel's top-left corner and 1,1 its bottom-right. A widget's X and Y place
; its top-left corner.
;
; Same section and key names as PRIBLUDA.INI. Only positions, `show` and the dash's
; `width` are read; colours, driver counts and key bindings still come from PRIBLUDA.INI.
; `show` here overrides pribluda's hotkeys for that widget in VR -- delete its
; line if you want to use the hotkeys.

[times]
show = 1
X =0.3483
Y =0.2707

[playerboard]
show = 1
X =0.7935
Y =0.2867

[leaderboard]
show = 1
X =0.8225
Y =0.0555

[trackpositionboard]
show = 1
X =0.0225
Y =0.0681

[tyres]
; pribluda's quirk: with show = 0 and showPatch = 1 the patch is drawn at X/Y.
show = 1
X =0.4305
Y =0.4582
showPatch = 1
patchX =0.4296
patchY =0.3817

[fps]
show = 1
X =0.4837
Y =0.0000

[dash]
; One row: X and Y are its top-left corner, width how far it spreads. Speed, gear and
; rpm centre themselves in that width, oil sits at its left end and fuel at its right.
show = 1
X =0.0290
Y =0.2270
width = 0.95

[loader]
; exe:  GPL executable to use, looked up in gplvr.exe's folder and then in its parent directory
; dll:  the mod that gplvr.exe loads into the game
; NOTE: to load a different exe from a script or shortcust,
;       use `gplvr.exe --exe other.exe`; other arguments are passed to the game
exe = gplc67.exe
dll = gplvr.dll

[gplvr]

; Play in VR mode. With no OpenXR runtime installed (SteamVR, Oculus, Pico, etc.)
; the game runs in flat mode; the reason is logged in gplvr.log
;   0  run in flat mode
;   1  run in VR mode
vr = 1

; How many launches' log folders to keep; older ones are deleted. 0 keeps them all.
logRuns = 5

; Game window size in pixels. Set both to 0 to use your current resolution and achieve higher performance
windowWidth = 0
windowHeight = 0

; Game window position, in pixels from the monitor's left and top edges
;   -1 centres it.
; Values are ignored when window size options are set to 0.
windowX = -1
windowY = -1

; Monitor index to use
;   0 lets Windows decide
windowScreen = 0

; Vsync override for the monitor, for debugging only; ignored in the headset
; 0 or above SUPERSEDES frameRate's vsync. 1 turns "unlimited" back into vsync
;  -1  let frameRate decide
;   0  vsync off
;   1  vsync on, one frame per refresh interval
; 2-4  vsync on, one frame per that many refreshes
swapInterval = -1

; Keep rendering while another program has focus. Always on in the headset
; NOTE: This does NOT pause the game
renderWhenUnfocused = 0

; GPL menu scaling mode
;   0  whole-number scale, sharp edges, widest borders
;   1  as large as fits, sharp edges, slightly uneven letters
;   2  as large as fits, smoothed
menuFilter = 2

; Correct the field of view for windows wider than 4:3. Ignored in the headset
widescreenFix = 1

; The game's black bars above and below the driving view
;   0: gplvr removes them and the view fills the window
;   1: keep GPL's letterbox
enableLetterbox = 0

; How the game exits
;   0  vanilla behavior
;   1  skip credits
;   2  skip credits and fast-forward exiting the game when receiving Alt+F4 or the window Close event. Press Alt+F4 twice in a second to kill GPL process
exitMode = 2

; Turn on the game's "driver arms" detail for cars seen in the mirrors; the game leaves it off.
; Without it, a car close behind can show its steering wheel as a yellow square in the mirror. No reason to turn it off really
mirrorDriverArms = 1

; How the rear-view mirrors are drawn ("Mirrors mode" in VR menu: 2D, 2.5D, 3D)
;   0  flat: one rear view that all mirrors share, without any depth
;   1  shared: same rear view as flat, but each eye gets its own mirror image so the reflection gets depth
;   2  per mirror: each mirror gets its own view drawn for each eye, most physically correct and the most expensive
mirrorMode = 2

; Redraw the mirrors every N frames, 1 to 16; 0 turns them black. The first thing
; to raise when short of frame rate: 3 or 4 still looks live. On the monitor it does nothing.
mirrorUpdateInterval = 1

; Where each mirror points is saved per car in gplvr_mirrors.ini; the VR menu's Mirror setup
; writes it for you.

; How fast the keyboard mirror setup (vrMirrorTweakKey; needs debugKeys = 1) moves a mirror
; while a key is held: degrees per second for aim, and for zoom how many times per second the
; view width doubles or halves.
vrMirrorTweakAngleSpeed = 10.0
vrMirrorTweakFovSpeed = 0.5

; How much of the car's rolling and pitching is cancelled in VR, 0.0 to 1.0
; Raise it if kerbs make you queasy
;   0.0  the view moves with the car
;   1.0  the horizon stays level
vrHorizonLock = 0.0

; The same, used in place of vrHorizonLock while a replay is shown
; ("Horizon lock in replays" in the VR menu)
vrReplayHorizonLock = 1.0

; How big the world is relative to you in the headset
vrWorldScale = 1.0

; Enable positional audio in VR. GPL doesn't implement true 3D audio, so only left/right panning is affected
vrHeadAudio = 1

; Positional audio effect strength, 0 to 2. ("Audio stereo width" in the VR menu)
;   0.0 is GPL's own very subtle panning
;   1.0 is more sensitive to your head position and orientation
;   2.0 if 1.0 is not enough for you
vrHeadAudioWidth = 1.0

; Use mouse to look around. i.e. in flat mode it's free look;
; in VR mode it replaces head tracking (for debugging)
vrMouseLook = 0

; vrMouseLook sensitivity
vrMouseLookSensitivity = 0.08

; 0: invert vrMouseLook pitch
vrMouseLookInvertPitch = 0

; How often a picture is drawn; it also sets vsync ("Frame rate lock" in the VR menu: GPL,
; Display, Unlocked)
;   0  vanilla: once per physics step (36/s stock, 144/s with a 144 Hz patch)
;   1  display: once per headset or monitor refresh
;   2  unlimited: as fast as possible, vsync off
frameRate = 1

; How GPL menu is shown in the headset ("GPL menu mode" in the VR menu)
;   0  head-locked: menu follows your view, sized by vrGplMenuScale
;   1  fixed: menu sits on a static panel at vrGplMenuDistance,
;             and recentering headset repositions GPL menu
vrGplMenuMode = 1

; in head-locked GPL menu mode:
; how much of your view the menu covers, 0.05 to 1.0
vrGplMenuScale = 0.5

; in fixed GPL menu mode:
; how far the menu panel sits, in metres, 0.75 to 5.0
vrGplMenuDistance = 2.0

; Brightness of the headset picture, 0.5 to 3.0
; 1.0 is true GPL brightness which might appear dark
vrGamma = 1.2

; How far away the GPL messages appear, in metres.
; 0 means infinitely far
vrGplTextDepth = 2.0

; How big GPL messages are, 1 to 4. Whole numbers only, so the pixel font stays sharp;
vrGplTextScale = 2

; How far out toward the edges of your view GPL messages sit, 0.1 to 1.0.
; 1.0 keeps the game's layout which may put text too far outside your view.
; Reduce it to bring text closer to center
vrGplTextSpread = 0.25

; Pribluda overlay in the headset ("Pribluda mode" in the VR menu)
; Its widgets are configured in gplvr_pribluda.ini
; via Pribluda layout in the VR menu
;   0  off
;   1  fixed: show it on a panel fixed in the car (like a dashboard)
;   2  head-locked: show it on a panel that follows your head
vrHudMode = 1

; Pribluda overlay position, in metres from your eyes
;
; for vrHudMode = 2 (head-locked):
vrHudHeadAhead = 0.70
vrHudHeadDown = 0.10
vrHudHeadRight = 0.0
vrHudHeadWidth = 0.45
;
; for vrHudMode = 1 (fixed):
vrHudSeatAhead = 0.70
vrHudSeatDown = 0.25
vrHudSeatRight = 0.0
vrHudSeatWidth = 0.60

; How dark the boxes behind the Pribluda text are:
;   0 invisible
;   1 solid black
vrHudBackdropOpacity = 0.30

; How fast the keyboard overlay setup (vrHudTweakKey; needs debugKeys = 1)
; moves Pribluda widget, in panel widths per second:
; 0.10 crosses the panel in ten seconds
vrHudTweakSpeed = 0.10

; Redraw Pribluda every N frames, 1 to 8.
; Its numbers change only a few times a second, so
; 2 halves the cost and looks the same.
pribludaUpdateInterval = 2

; Renderer to use ("Renderer" in the VR menu),
;   0  Vanilla: GPL's original renderer. Very inefficient, especilly on modded tracks and carsets
;   1  GPL VR: custom renderer, uses less CPU; the game still draws the sky, smoke and
;      shadows. The track takes a few seconds to prepare when it loads
;   2  GPL VR (debug): same as 1, with a red square in the corner of every image it drew, for debugging or comparison

; in VR
vrRendererType = 1

; in flat (non-VR) mode
; If your hardware can't reach stable FPS at your monitor refresh rate, try setting this to type 1
flatRendererType = 0

; Fixes non-VR mode artifacts (mirror texture spilling into top left corner, Pribluda widgets flickering and others)
; when using NVIDIA "OpenGL present method" = "Prefer layered on DXGI Swapchain"
; Tradeoffs: costs a little performance and drops driver-forced anti-aliasing
flatOffscreenFrame = 0

; Multiplies the per-eye resolution the headset asks for; 1.0 is its own recommendation.
; WARNING: raising this value will significantly increase render target resolution,
;          which in the end might not fit into GPL's 2GB memory limit.
;          gpl.exe needs a 4 GB patch to handle higher memory requirements
vrRenderScale = 1.0

; Reduces VR memory overhead.
; Set to 1 if you run into GPL's 2 GB memory limit.
; WARNING: This option may introduce artifacts on some hardware & drivers
vrDirectToShared = 0

; Wait for the graphics card to finish each frame before sending it to the headset
; 0 might improve framerate but might introduce tearing or flickering
vrTransferFinish = 1

; What the monitor shows while you are in the headset ("Monitor view" in the VR menu)
;   0  nothing -- saves a little work
;   1  the left eye
;   2  the right eye
;   3  both eyes
vrMonitorEye = 2

; The game shows TV static for a moment when it switches camera or driver's head gets underground.
; In a race the headset holds the last picture for this many milliseconds first, then shows the
; static in both eyes; 0 shows the static at once. Replays always show it at once.
vrNoSignalDelay = 250


; Frame rate and where each frame's time went
profileFrame = 0

; Time the graphics card, to tell a GPU limit from a CPU one
profileGpuWait = 0

; Count polygons and their cost
profilePolys = 0

; Where every millisecond of a frame went, with time spent waiting kept apart from time spent working, and each second's worst frame. VR
; only option. The biggest figure is usually idle waiting, not a cost.
profileStages = 0

; Just the working-versus-waiting totals from the line above
profileWorkWait = 0

; For the two above: a single draw command slower than this many microseconds counts as
; waiting for the graphics driver, not as work. 0 turns this off: every draw counts as work.
profileStallUs = 50

; Use OpenGL debug context and more verbose rendering logs
; 0 all debugging features disabled
; 1 logs error and warning messages from the driver
; 2 also waits for the GPU after every step of the first 300 frames and logs each one
glTrace = 0

; Keyboard hotkeys for testing; the VR menu and controllers do all of this except mouse look.
; The keys below work only when this option is set to 1.
; Each value is a Windows key code (65 = A, 48 = 0);
; 0 disables that key
debugKeys = 0

; Mirror setup from the keyboard. 77 = M. While in it, Home picks a mirror, arrows aim it,
; Page Up/Down zoom. M again leaves and saves the aim for this car. Headset only.
vrMirrorTweakKey = 77

; Step to the next mirrorMode. 78 = N. Headset only.
vrMirrorModeKey = 78

; Recentre the seat. 51 = '3'. Headset only.
vrRecentreKey = 51

; Mouse look on and off. 54 = '6'.
vrMouseLookKey = 54

; Switch the overlay between following your head and fixed in the car. 36 = Home. From
; vrHudMode 0 it switches to following your head. Does nothing inside keyboard mirror
; setup, which uses Home itself.
vrHudLayerKey = 36

; Overlay setup from the keyboard. 35 = End. The selected readout flashes: arrows move it,
; Page Up/Down pick another, End again saves and leaves.
vrHudTweakKey = 35

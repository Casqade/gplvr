; gplvr_mirrors.ini -- mirror presets, written by gplvr's mirror tweaking mode.
; One section per car: [<car-set folder>/<team folder>], lower case, e.g. [cars67/lotus].
; In it <mirror>Yaw, <mirror>Pitch and <mirror>FovScale for each mirror -- left, right or centre.
; Positive yaw turns that mirror's view toward the car's right, so a symmetric pair has opposite signs.
; To reset a car preset, delete its section.
;
; Shipped with presets for:
;   cars67 (GPL Beta)
;   cars18 (GPL 2020 Demo)

